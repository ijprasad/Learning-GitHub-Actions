name: My workflow
# To get a trigger on every commit.
on: 
  push:
    branches:
      - dev
      - 'feature-*'
      - main
  pull_request:
    branches:
      - main
      
jobs:
  Job1:
    name: My Job 1
    runs-on: ubuntu-latest
    steps:
      - name: Step 1
        run: |
          pwd
          ls -ltr
          hostname
      - name: Step 2
        uses: actions/checkout@v7
      - name: Step 3
        run: |
          echo pwd >> myartifact.txt
          mkdir artifacts
          echo 'ls -ltr' >> artifacts/list.txt
          echo 'hostname' >> artifacts/hostname.txt


  Job2:
    name: My Job 2
    runs-on: ubuntu-latest
    steps:
      - name: Step 1
        run: exit 1

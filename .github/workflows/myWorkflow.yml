name: My workflow
# To get a trigger on every commit.
on: 
  push:
    branches:
      - dev
      - 'feature-*'
      - main

      
jobs:
  Job1:
    name: My Job 1
    runs-on: ubuntu-latest
    steps:
      - name: Step 1
        run: |
          pwd
          ls -ltr
          hostname
      - name: Step 2
        uses: actions/checkout@v7
      - name: Step 3
        run: |
          echo pwd >> myartifact.txt
          mkdir artifacts
          echo 'ls -ltr' >> artifacts/list.txt
          echo 'hostname' >> artifacts/hostname.txt
      - name: upload single file
        uses: actions/upload-artifact@v7.0.2        
        with:
          name: single_file
          path: ./myartifact.txt
      - name: upload from directory
        uses: actions/upload-artifact@v7.0.2        
        with:
          name: directory_artifacts
          path: artifacts/
      - name: upload from multiple path
        uses: actions/upload-artifact@v7.0.2        
        with:
          name: multiple_path
          path: |
            ./myartifact.txt
            artifacts/
      - name: upload from multiple path with exclusion
        uses: actions/upload-artifact@v7.0.2        
        with:
          name: multiple_path_with_expclusion
          path: |
            ./myartifact.txt
            artifacts/
            !**/hostname.txt


          
        
        

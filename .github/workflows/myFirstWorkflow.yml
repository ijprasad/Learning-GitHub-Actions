name: My First workflow
# To get a trigger on every commit.
on: 
  schedule:
    - cron: '*/5 * * * *'    
  workflow_dispatch: 
  

jobs:
  MyJob1:
    name: My Job 1
    runs-on: ubuntu-latest
    steps:
      - name: Running Single command in Job 1
        run: echo "Hi, this is my first GitHub Workflow"
      - name: Checking OS Release for GitHub working
        run: cat /etc/os-release
      - name: Calling Sleep
        run: sleep 20
  MyJob2:
    name: My Job 2
    runs-on: ubuntu-latest
    steps:
      - name: Checking the HostName for Runner
        run: hostname
      - name: Running multiple commands
        run: |
          echo "Hi, from Inderjeet Prasad"
          echo "Current date is $(date +'%Y-%m-%d')"
          sleep 20
  MyJob3:
    name: My Job 3
    needs: MyJob1
    runs-on: windows-latest
    steps:
      - name: Job with Single Dependency
        run: |
          sleep 10
          echo "GitHub started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - name: Checking Runner Info
        shell: pwsh
        run: get-computerinfo
  MyJob4:
    name: My Job 4
    needs:
      - MyJob1
      - MyJob2
      - MyJob3
    runs-on: macos-latest
    steps:
      - name: Job with Multiple Dependecy
        run: sleep 10
      - name: Checking Runner Info
        run: sw_vers
